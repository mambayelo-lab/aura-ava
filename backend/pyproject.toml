[project]
name = "aura-ava-backend"
version = "3.0.0"
description = "AURA AVA V3 - Architecture Vision Assistant - Decision Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "neo4j>=5.16.0",
  "python-dotenv>=1.0.0",
  "anthropic>=0.18.0",
]

[tool.uvicorn]
factory = false

[tool.pytest.ini_options]
testpaths = ["tests"]
